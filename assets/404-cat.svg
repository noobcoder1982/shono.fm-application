<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="cat-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
  </defs>

  <rect width="600" height="700" fill="url(#cat-bg)"/>

  <!-- Glowing Crown Doodle above Cat -->
  <g transform="translate(330, 80) rotate(15)" stroke="#ffc72c" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0 50 L 15 10 L 40 35 L 65 10 L 80 50 Z"/>
    <circle cx="15" cy="8" r="3" fill="#ffc72c"/>
    <circle cx="40" cy="33" r="3" fill="#ffc72c"/>
    <circle cx="65" cy="8" r="3" fill="#ffc72c"/>
  </g>

  <!-- Black Cat Silhouette looking up -->
  <g fill="#050507" stroke="#1f1f26" stroke-width="2">
    <!-- Cat body -->
    <path d="M 150 700 C 180 480, 240 400, 360 400 C 480 400, 540 480, 580 700 Z"/>
    
    <!-- Cat head tilted slightly up -->
    <ellipse cx="370" cy="310" rx="110" ry="95"/>

    <!-- Left ear -->
    <polygon points="280,270 270,160 340,230"/>
    <!-- Right ear -->
    <polygon points="410,230 480,160 460,270"/>

    <!-- Glowing Cat Eyes (Green/Yellow) -->
    <ellipse cx="325" cy="295" rx="14" ry="20" fill="#ffc72c" stroke="#ffc72c" stroke-width="2"/>
    <ellipse cx="325" cy="295" rx="4" ry="18" fill="#000000"/>
    <ellipse cx="405" cy="295" rx="14" ry="20" fill="#ffc72c" stroke="#ffc72c" stroke-width="2"/>
    <ellipse cx="405" cy="295" rx="4" ry="18" fill="#000000"/>

    <!-- Whiskers -->
    <path d="M 280 320 L 190 310 M 280 330 L 180 335 M 280 340 L 190 360" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    <path d="M 450 320 L 540 310 M 450 330 L 550 335 M 450 340 L 540 360" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Placeholder label -->
  <rect x="30" y="30" width="140" height="26" rx="6" fill="rgba(0,0,0,0.6)" stroke="#383842"/>
  <text x="100" y="47" fill="#a1a1aa" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" text-anchor="middle">404-cat.png</text>
</svg>
