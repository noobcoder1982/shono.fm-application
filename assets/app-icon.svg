<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Dark Badge -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0d1117" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Dynamic Soundwave Antenna / Equalizer Bars -->
  <g filter="url(#glow)" stroke="url(#neonGlow)" stroke-width="4" stroke-linecap="round">
    <line x1="16" y1="36" x2="16" y2="28" />
    <line x1="24" y1="42" x2="24" y2="22" />
    <line x1="32" y1="48" x2="32" y2="16" />
    <line x1="40" y1="44" x2="40" y2="20" />
    <line x1="48" y1="36" x2="48" y2="28" />
  </g>

  <!-- FM Dot Accent -->
  <circle cx="48" cy="18" r="2.5" fill="#00ff87" />
</svg>
